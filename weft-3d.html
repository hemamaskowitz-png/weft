<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#080c14">
<title>Weft 3D</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  :root { --bg:#080c14; --card:#131d2e; --border:rgba(255,255,255,0.08); --text:#c8d4e8; --dim:#5a6a80; --bright:#e8f0ff; }
  html, body { height: 100%; background: var(--bg); color: var(--text); font-family: 'Space Grotesk', system-ui, sans-serif; overflow: hidden; }
  @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600&family=Space+Mono:wght@400;700&display=swap');
  #scene { position: fixed; inset: 0; }
  #hud { position: fixed; top: 0; left: 0; right: 0; display: flex; align-items: center; justify-content: space-between; padding: 0.8rem 1.2rem; pointer-events: none; z-index: 5; }
  .hud-title { font-family: 'Space Mono', monospace; font-weight: 700; font-size: 1.6rem; letter-spacing: 0.1em; color: transparent; background: linear-gradient(135deg,#4a7fc0,#7a5ce0 50%,#c05ca0); -webkit-background-clip: text; background-clip: text; }
  .hud-sub { font-size: 0.6rem; color: var(--dim); letter-spacing: 0.08em; text-transform: uppercase; margin-top: 0.15rem; }
  .era-bar { display: flex; gap: 0.4rem; pointer-events: auto; }
  .era-btn, .hud-link { background: rgba(19,29,46,0.85); border: 1px solid var(--border); color: var(--dim); font-family: 'Space Mono', monospace; font-size: 0.65rem; padding: 0.5rem 0.9rem; border-radius: 8px; cursor: pointer; text-decoration: none; transition: all 0.15s; }
  .era-btn.active { background: rgba(122,92,224,0.3); color: var(--bright); border-color: rgba(122,92,224,0.5); }
  .era-btn:hover, .hud-link:hover { color: var(--bright); }
  .era-btn.mode { color: #e8c878; border-color: rgba(232,200,120,0.4); margin-right: 0.4rem; }
  #playBtn { background: none; border: 1px solid var(--border); color: var(--bright); border-radius: 50%; width: 24px; height: 24px; font-size: 0.6rem; cursor: pointer; line-height: 1; padding: 0; flex-shrink: 0; }
  #playBtn:hover { border-color: rgba(122,92,224,0.6); }
  .nav-row { display: flex; align-items: center; gap: 0.6rem; }
  .nav-row input { flex: 1; }
  #help { position: fixed; bottom: 0.8rem; left: 1.2rem; font-family: 'Space Mono', monospace; font-size: 0.55rem; color: var(--dim); z-index: 5; pointer-events: none; }
  #tip { position: fixed; z-index: 10; background: var(--card); border: 1px solid var(--border); border-radius: 8px; padding: 0.5rem 0.7rem; pointer-events: none; opacity: 0; transition: opacity 0.1s; max-width: 260px; box-shadow: 0 6px 24px rgba(0,0,0,0.5); }
  #tip.on { opacity: 1; }
  .tip-t { font-size: 0.75rem; font-weight: 600; color: var(--bright); }
  .tip-d { font-family: 'Space Mono', monospace; font-size: 0.55rem; color: var(--dim); margin-top: 0.2rem; }
  #card { position: fixed; top: 70px; right: 1rem; width: 340px; max-width: calc(100vw - 2rem); max-height: calc(100vh - 120px); overflow-y: auto; background: rgba(19,29,46,0.96); border: 1px solid var(--border); border-radius: 14px; padding: 1.1rem 1.2rem; z-index: 8; display: none; backdrop-filter: blur(6px); }
  #card.on { display: block; }
  .card-img { margin: -1.1rem -1.2rem 0.9rem; border-radius: 14px 14px 0 0; overflow: hidden; position: relative; display: none; background: #0b111d; }
  .card-img img { display: block; width: 100%; max-height: 220px; object-fit: cover; }
  .card-img .cr { position: absolute; right: 0.5rem; bottom: 0.35rem; font-family: 'Space Mono', monospace; font-size: 0.5rem; color: rgba(255,255,255,0.7); text-shadow: 0 1px 3px #000; }
  .card-close { position: absolute; top: 0.5rem; right: 0.7rem; background: none; border: none; color: var(--dim); font-size: 1.1rem; cursor: pointer; }
  .card-dom { display: flex; align-items: center; gap: 0.4rem; font-family: 'Space Mono', monospace; font-size: 0.58rem; text-transform: uppercase; letter-spacing: 0.1em; margin-bottom: 0.4rem; }
  .card-title { font-size: 1.05rem; font-weight: 600; color: var(--bright); line-height: 1.3; }
  .card-date { font-family: 'Space Mono', monospace; font-size: 0.58rem; color: var(--dim); margin: 0.25rem 0 0.7rem; }
  .card-body { font-size: 0.78rem; line-height: 1.6; }
  .card-link { display: inline-block; margin-top: 0.8rem; font-family: 'Space Mono', monospace; font-size: 0.62rem; padding: 0.35rem 0.7rem; border: 1px solid; border-radius: 6px; text-decoration: none; }
  .card-threads { margin-top: 0.9rem; display: flex; flex-wrap: wrap; gap: 0.35rem; }
  .ct-label { width: 100%; font-family: 'Space Mono', monospace; font-size: 0.55rem; letter-spacing: 0.12em; text-transform: uppercase; color: var(--dim); }
  .ct-chip { display: inline-flex; align-items: center; gap: 0.35rem; background: rgba(255,255,255,0.04); border: 1px solid var(--border); color: var(--text); font-size: 0.66rem; padding: 0.3rem 0.55rem; border-radius: 14px; cursor: pointer; font-family: inherit; text-align: left; }
  .ct-chip:hover { border-color: rgba(255,255,255,0.3); }
  .ct-dot { width: 7px; height: 7px; border-radius: 50%; flex-shrink: 0; }
  .ct-year { font-family: 'Space Mono', monospace; font-size: 0.55rem; color: var(--dim); }
  /* NAV SLIDERS — bottom right */
  #nav { position: fixed; right: 1.2rem; bottom: 1rem; z-index: 6; display: flex; align-items: flex-end; gap: 0.5rem; }
  .nav-time, .nav-zoom { background: rgba(19,29,46,0.78); border: 1px solid var(--border); border-radius: 14px; backdrop-filter: blur(6px); }
  .nav-time { display: flex; flex-direction: column; gap: 0.45rem; width: 320px; max-width: 60vw; padding: 0.7rem 1rem 0.85rem; }
  .nav-zoom { padding: 0.6rem 0.5rem; }
  .nav-label { display: flex; justify-content: space-between; font-family: 'Space Mono', monospace; font-size: 0.55rem; letter-spacing: 0.1em; text-transform: uppercase; color: var(--dim); }
  .nav-label b { color: var(--bright); font-weight: 700; letter-spacing: 0.05em; }
  .nav-zoom { display: flex; flex-direction: column; align-items: center; gap: 0.3rem; }
  .zoom-track { width: 22px; height: 120px; position: relative; }
  .zoom-track input { position: absolute; width: 120px; left: 50%; top: 50%; transform: translate(-50%, -50%) rotate(-90deg); }
  .zoom-ico { font-family: 'Space Mono', monospace; font-size: 0.8rem; color: var(--dim); line-height: 1; user-select: none; }
  #nav input[type=range] { -webkit-appearance: none; appearance: none; height: 4px; border-radius: 2px; background: rgba(255,255,255,0.12); outline: none; cursor: pointer; margin: 0; }
  #nav input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; width: 16px; height: 16px; border-radius: 50%; background: radial-gradient(circle at 35% 35%, #c0b0ff, #7a5ce0); box-shadow: 0 0 10px rgba(122,92,224,0.7); border: none; }
  #nav input[type=range]::-moz-range-thumb { width: 16px; height: 16px; border-radius: 50%; background: radial-gradient(circle at 35% 35%, #c0b0ff, #7a5ce0); box-shadow: 0 0 10px rgba(122,92,224,0.7); border: none; }
  @media (max-width: 600px) {
    #nav { right: 0.6rem; bottom: 0.6rem; left: 0.6rem; justify-content: flex-end; }
    .nav-time { flex: 1; max-width: none; width: auto; }
    .zoom-track { height: 90px; } .zoom-track input { width: 90px; }
    #help { display: none; }
    #hud { flex-direction: column; align-items: stretch; gap: 0.5rem; padding: 0.7rem 0.6rem; }
    .hud-sub { display: none; }
    .era-bar { overflow-x: auto; scrollbar-width: none; padding-bottom: 2px; }
    .era-bar::-webkit-scrollbar { display: none; }
    .era-btn, .hud-link { flex-shrink: 0; padding: 0.45rem 0.7rem; }
    #card { top: auto; bottom: 150px; right: 0.6rem; left: 0.6rem; width: auto; max-height: 50vh; }
  }

  #loading { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; background: var(--bg); z-index: 20; font-family: 'Space Mono', monospace; letter-spacing: 0.15em; color: var(--bright); transition: opacity 0.4s; }
  #loading.off { opacity: 0; pointer-events: none; }
</style>
</head>

<style>

<script>
// ── WEFT WHO: people & places ─────────────────────────────────────────────────
// Birth and death details come live from Wikidata, so they are sourced, not typed in.
window.WeftWho = (() => {
  const M = ['January','February','March','April','May','June','July','August','September','October','November','December'];
  let D = null, onJump = () => {}, onPerson = () => {}, onClose = () => {}, onGlobe = null;
  const lifeCache = new Map();
  const panel = () => document.getElementById('whoPanel');
  const body = () => document.getElementById('whoBody');
  const esc = s => String(s == null ? '' : s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

  function init(data, hooks = {}) {
    D = data;
    onJump = hooks.onJump || onJump; onPerson = hooks.onPerson || onPerson; onClose = hooks.onClose || onClose; onGlobe = hooks.onGlobe || null;
    panel().querySelector('.wp-close').addEventListener('click', close);
    document.addEventListener('keydown', e => { if (e.key === 'Escape' && panel().classList.contains('on')) { e.stopPropagation(); close(); } }, true);
  }
  function close() { panel().classList.remove('on'); onClose(); }

  // ── Wikidata ──
  async function getJSON(url) { const r = await fetch(url); if (!r.ok) throw new Error(r.status); return r.json(); }
  function claim(ent, p) {
    const c = ent && ent.claims && ent.claims[p]; if (!c || !c.length) return null;
    const best = c.find(x => x.rank === 'preferred') || c.find(x => x.rank !== 'deprecated') || c[0];
    return best.mainsnak && best.mainsnak.datavalue ? best.mainsnak.datavalue.value : null;
  }
  function parseTime(v) {
    if (!v || !v.time) return null;
    const m = v.time.match(/^([+-])(\d+)-(\d\d)-(\d\d)/); if (!m) return null;
    const year = (m[1] === '-' ? -1 : 1) * parseInt(m[2], 10);
    return { year, month: v.precision >= 10 && +m[3] ? +m[3] : null, day: v.precision >= 11 && +m[4] ? +m[4] : null };
  }
  async function lookup(title) {
    const pp = await getJSON(`https://en.wikipedia.org/w/api.php?action=query&prop=pageprops&ppprop=wikibase_item&redirects=1&format=json&origin=*&titles=${encodeURIComponent(title.replace(/_/g, ' '))}`);
    const pg = pp.query && pp.query.pages && Object.values(pp.query.pages)[0];
    const qid = pg && pg.pageprops && pg.pageprops.wikibase_item; if (!qid) return null;
    const ent = (await getJSON(`https://www.wikidata.org/w/api.php?action=wbgetentities&ids=${qid}&props=claims&format=json&origin=*`)).entities[qid];
    const born = parseTime(claim(ent, 'P569')), died = parseTime(claim(ent, 'P570'));
    const bp = claim(ent, 'P19'), dp = claim(ent, 'P20');
    const ids = [...new Set([bp && bp.id, dp && dp.id].filter(Boolean))];
    const pl = {};
    if (ids.length) {
      const pe = (await getJSON(`https://www.wikidata.org/w/api.php?action=wbgetentities&ids=${ids.join('|')}&props=labels|claims&languages=en&format=json&origin=*`)).entities;
      const cids = new Set();
      for (const [id, e] of Object.entries(pe)) {
        const co = claim(e, 'P625'), ct = claim(e, 'P17');
        pl[id] = { name: e.labels && e.labels.en ? e.labels.en.value : null, lat: co ? co.latitude : null, lon: co ? co.longitude : null, countryId: ct ? ct.id : null };
        if (ct && ct.id !== id) cids.add(ct.id);
      }
      if (cids.size) {
        const ce = (await getJSON(`https://www.wikidata.org/w/api.php?action=wbgetentities&ids=${[...cids].join('|')}&props=labels&languages=en&format=json&origin=*`)).entities;
        Object.values(pl).forEach(p => { if (p.countryId && ce[p.countryId] && ce[p.countryId].labels.en) p.country = ce[p.countryId].labels.en.value; });
      }
    }
    return { qid, born: born && { ...born, place: bp ? pl[bp.id] : null }, died: died && { ...died, place: dp ? pl[dp.id] : null } };
  }
  function life(title) {
    if (!lifeCache.has(title)) lifeCache.set(title, lookup(title).catch(() => null));
    return lifeCache.get(title);
  }
  function fmtDate(d) { if (!d) return ''; const y = d.year < 0 ? `${-d.year} BC` : d.year; return [d.day, d.month ? M[d.month - 1] : null, y].filter(Boolean).join(' '); }
  function fmtPlace(p) { if (!p || !p.name) return ''; return p.country && p.country !== p.name ? `${p.name}, ${p.country}` : p.name; }
  function ageAt(b, d) {
    if (!b) return null;
    const now = new Date(), e = d || { year: now.getFullYear(), month: now.getMonth() + 1, day: now.getDate() };
    let a = e.year - b.year;
    if (b.month && e.month && (e.month < b.month || (e.month === b.month && b.day && e.day && e.day < b.day))) a--;
    return a;
  }


  // ── Dates at the precision we actually know ──
  function fmtEvDate(e) {
    const p = e.precision || 'day';
    if (p === 'year') return String(e.year);
    if (p === 'month') return `${M[e.month - 1]} ${e.year}`;
    return `${e.day} ${M[e.month - 1]} ${e.year}`;
  }

  // ── Art as response: what a work answered, and what an event inspired ──
  function inspiredBy(id) { return D.events.filter(e => (e.respondsTo || []).includes(id)).sort((a, b) => evKey(a) - evKey(b)); }
  function responseIds(ev) { return new Set([...(ev.respondsTo || []), ...inspiredBy(ev.id).map(e => e.id)]); }
  function renderResponses(container, ev) {
    container.innerHTML = '';
    const row = (label, list) => {
      if (!list.length) return;
      const l = document.createElement('div'); l.className = 'resp-label'; l.textContent = label; container.appendChild(l);
      list.forEach(e => {
        const d = D.domains[e.domain] || { color: '#888' };
        const b = document.createElement('button'); b.className = 'resp-chip';
        b.innerHTML = `<span class="d" style="background:${d.color}"></span><span>${esc(e.title)}</span><span class="y">${e.year}</span>`;
        b.addEventListener('click', () => onJump(e.id));
        container.appendChild(b);
      });
    };
    row('Made in response to', (ev.respondsTo || []).map(evById).filter(Boolean));
    row(ev.art ? 'Answered in turn by' : 'Art it inspired', inspiredBy(ev.id));
  }

  // ── World outline (Natural Earth, public domain) and small locator globes ──
  let worldP = null;
  function world() {
    if (!worldP) worldP = fetch('weft-world.json', { cache: 'no-cache' }).then(r => r.ok ? r.json() : null).catch(() => null);
    return worldP;
  }
  function drawLocator(cv, lat, lon) {
    const dpr = Math.min(devicePixelRatio || 1, 2), css = cv.clientWidth || 84;
    cv.width = css * dpr; cv.height = css * dpr;
    const g = cv.getContext('2d'); g.scale(dpr, dpr);
    const R = css / 2 - 2, cx = css / 2, cy = css / 2, rad = Math.PI / 180;
    const p0 = Math.max(-60, Math.min(60, lat)) * rad, l0 = lon * rad;
    const sp0 = Math.sin(p0), cp0 = Math.cos(p0);
    const proj = (lo, la) => {
      const p = la * rad, l = lo * rad, cp = Math.cos(p), sp = Math.sin(p), cl = Math.cos(l - l0);
      return [cx + R * cp * Math.sin(l - l0), cy - R * (cp0 * sp - sp0 * cp * cl), sp0 * sp + cp0 * cp * cl > 0];
    };
    const grd = g.createRadialGradient(cx - R * 0.3, cy - R * 0.3, R * 0.1, cx, cy, R);
    grd.addColorStop(0, '#13233d'); grd.addColorStop(1, '#070d18');
    g.fillStyle = grd; g.beginPath(); g.arc(cx, cy, R, 0, Math.PI * 2); g.fill();
    g.strokeStyle = 'rgba(92,160,224,0.45)'; g.lineWidth = 1; g.stroke();
    const lines = (arr, style, w) => {
      g.strokeStyle = style; g.lineWidth = w; g.beginPath();
      arr.forEach(a => { let pen = false; for (let i = 0; i < a.length; i += 2) { const [x, y, v] = proj(a[i] / 10, a[i + 1] / 10); if (v) { pen ? g.lineTo(x, y) : g.moveTo(x, y); pen = true; } else pen = false; } });
      g.stroke();
    };
    world().then(w => {
      if (w) { lines(w.borders, 'rgba(92,160,224,0.22)', 0.6); lines(w.coast, 'rgba(120,180,240,0.85)', 0.9); }
      const [x, y, v] = proj(lon, lat);
      if (!v) return;
      const glow = g.createRadialGradient(x, y, 0, x, y, 10);
      glow.addColorStop(0, 'rgba(232,200,120,0.9)'); glow.addColorStop(1, 'rgba(232,200,120,0)');
      g.fillStyle = glow; g.beginPath(); g.arc(x, y, 10, 0, Math.PI * 2); g.fill();
      g.fillStyle = '#fff3d0'; g.beginPath(); g.arc(x, y, 2.4, 0, Math.PI * 2); g.fill();
    });
  }
  function locator(lat, lon, cls, title) {
    const cv = document.createElement('canvas'); cv.className = cls; cv.title = title || '';
    requestAnimationFrame(() => drawLocator(cv, lat, lon));
    return cv;
  }

  // ── Event pictures from Wikipedia ──
  // Uses Wikipedia's own "page image" for the article, at a standard size; falls back to the summary thumbnail as given.
  const imgCache = new Map();
  function image(ev) {
    if (ev.image) return Promise.resolve({ src: ev.image, credit: ev.imageCredit });
    const m = (ev.wiki || '').match(/\/wiki\/([^#?]+)/); if (!m) return Promise.resolve(null);
    let title; try { title = decodeURIComponent(m[1]).replace(/_/g, ' '); } catch (e) { title = m[1].replace(/_/g, ' '); }
    if (imgCache.has(title)) return imgCache.get(title);
    const p = (async () => {
      try {
        const j = await getJSON(`https://en.wikipedia.org/w/api.php?action=query&prop=pageimages&piprop=thumbnail&pithumbsize=960&redirects=1&format=json&origin=*&titles=${encodeURIComponent(title)}`);
        const pg = j.query && j.query.pages && Object.values(j.query.pages)[0];
        if (pg && pg.thumbnail && pg.thumbnail.source) return { src: pg.thumbnail.source, credit: 'Wikipedia / Wikimedia Commons' };
      } catch (e) { /* try the summary instead */ }
      try {
        const j = await getJSON(`https://en.wikipedia.org/api/rest_v1/page/summary/${encodeURIComponent(title.replace(/ /g, '_'))}`);
        if (j.thumbnail && j.thumbnail.source) return { src: j.thumbnail.source, credit: 'Wikipedia / Wikimedia Commons' };
      } catch (e) { /* offline or blocked */ }
      return null;
    })();
    imgCache.set(title, p);
    return p;
  }

  // ── Lookups in Weft's own data ──
  const evById = id => D.events.find(e => e.id === id);
  const evKey = e => e.year * 10000 + e.month * 100 + e.day;
  function eventsWithPerson(t) { return D.events.filter(e => (e.people || []).includes(t)).sort((a, b) => evKey(a) - evKey(b)); }
  function eventsAtPlace(k) { return D.events.filter(e => e.place === k).sort((a, b) => evKey(a) - evKey(b)); }
  function placeKeyByName(name) {
    if (!name) return null;

  // ── Chips on an event card ──
  function renderChips(container, ev) {

      const p = D.people[t]; if (!p) return;

      container.appendChild(b);
    });

      const b = document.createElement('button'); b.className = 'who-chip place';
      b.innerHTML = `<span class="wi">&#128205;</span><span>${esc(pl.name)}</span>`;
      b.addEventListener('click', () => openPlace(pk));
      container.appendChild(b);
    }
  }

  function eventRow(e) {
    const d = D.domains[e.domain] || { color: '#888' };
    const b = document.createElement('button'); b.className = 'wp-ev';
    b.innerHTML = `<span class="d" style="background:${d.color}"></span><span>${esc(e.title)}</span><span class="y">${e.year}</span>`;
    b.addEventListener('click', () => onJump(e.id));
    return b;
  }

  // ── Person panel ──
  function openPerson(t) {
    const p = D.people[t]; if (!p) return;
    const evs = eventsWithPerson(t);
    body().innerHTML = `
      <div class="wp-kind">Person</div>
      <div class="wp-name">${esc(p.name)}</div>
      <div class="wp-desc">${esc(p.desc)}</div>
      <div class="wp-loading" id="wpLife">Looking up birth and death on Wikidata&hellip;</div>
      <div class="wp-sec">In Weft &middot; ${evs.length} event${evs.length === 1 ? '' : 's'}</div>
      <div class="wp-events" id="wpEvents"></div>
      <a class="wp-link" href="${esc(p.wiki)}" target="_blank" rel="noopener">&rarr; Wikipedia</a>`;
    const list = body().querySelector('#wpEvents');
    evs.forEach(e => list.appendChild(eventRow(e)));
    panel().classList.add('on'); panel().scrollTop = 0;
    onPerson(t, null, evs);
    life(t).then(L => {
      const slot = body().querySelector('#wpLife');
      if (!slot || body().querySelector('.wp-name').textContent !== p.name) return;
      if (!L || (!L.born && !L.died)) { slot.textContent = 'Birth and death details unavailable right now.'; onPerson(t, null, evs); return; }
      const row = (k, d, extra) => {
        const pkey = d.place && placeKeyByName(d.place.name);
        const placeHtml = d.place && d.place.name ? (pkey ? `<button data-pk="${pkey}">${esc(fmtPlace(d.place))}</button>` : esc(fmtPlace(d.place))) : '<span style="color:#5a6a80">place not recorded</span>';
        return `<div class="k">${k}</div><div class="v">${esc(fmtDate(d))}${extra ? ` <small>${extra}</small>` : ''}<small>${placeHtml}</small></div>`;
      };
      const a = ageAt(L.born, L.died);
      let html = '<div class="wp-life">';
      if (L.born) html += row('Born', L.born, '');
      if (L.died) html += row('Died', L.died, a != null ? `aged ${a}` : '');
      else if (L.born && a != null && a < 125) html += `<div class="k">Now</div><div class="v">${a} years old</div>`;
      html += '</div>';
      // life bar with Weft events as ticks
      if (L.born) {
        const y0 = L.born.year, y1 = L.died ? L.died.year : new Date().getFullYear();
        const span = Math.max(1, y1 - y0);

  }

  // ── Place panel ──
  function openPlace(k) {
    const pl = D.places[k]; if (!pl) return;
    const evs = eventsAtPlace(k);
    const coords = pl.lat != null ? `${Math.abs(pl.lat).toFixed(2)}&deg;${pl.lat >= 0 ? 'N' : 'S'}, ${Math.abs(pl.lon).toFixed(2)}&deg;${pl.lon >= 0 ? 'E' : 'W'}` : '';

      <div class="wp-events" id="wpLives"></div>`;
    const list = body().querySelector('#wpEvents');
    evs.forEach(e => list.appendChild(eventRow(e)));
    if (pl.lat != null) body().insertBefore(locator(pl.lat, pl.lon, 'wp-globe', pl.name), body().firstChild);

    // Check the people already looked up this session for births/deaths here
    const lives = body().querySelector('#wpLives');
    lifeCache.forEach((prom, t) => prom.then(L => {
      if (!L || !body().querySelector('#wpLives')) return;
      [['born', L.born], ['died', L.died]].forEach(([kind, d]) => {
        if (d && d.place && placeKeyByName(d.place.name) === k) {

          b.innerHTML = `<span class="d" style="background:#e8c878"></span><span>${esc(D.people[t].name)} ${kind} here</span><span class="y">${d.year}</span>`;

      });

  }

  return { init, renderChips, openPerson, openPlace, close, life, fmtDate, fmtPlace, image, world, fmtEvDate, renderResponses, responseIds };
})();

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

const MONTH_NAMES = ['January','February','March','April','May','June','July','August','September','October','November','December'];
const GROUPS = [
  { name: 'POWER & MONEY',  keys: ['politics','conflict','economics','law'] },
  { name: 'SCIENCE',        keys: ['space','physics','biology','earth','disasters'] },
  { name: 'MAKING & MOVING',keys: ['tech','transport','exploration','games'] },
  { name: 'ARTS',           keys: ['visualart','theatre','music','film','literature','architecture','fashion'] },
  { name: 'LIFE',           keys: ['food','religion','sport','people','society'] },
];
const ERAS = { '1492': [1492,1492], '1776': [1776,1776], '1914': [1914,1914], 'modern': [1970,1999] };
const DECADES = { '1970s': 1970, '1980s': 1980, '1990s': 1990 };

let DOMAINS = {}, ALL_EVENTS = [], THREAD_MAP = new Map();
let era = 'modern';

// ── SCENE ──────────────────────────────────────────────────────────────────────
const canvas = document.getElementById('scene');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x080c14);
scene.fog = new THREE.Fog(0x080c14, 900, 5200);
const camera = new THREE.PerspectiveCamera(55, 1, 0.5, 12000);
camera.position.set(40, 120, 330);
const controls = new OrbitControls(camera, canvas);
controls.enableDamping = true;
controls.dampingFactor = 0.08;
controls.maxDistance = 5000;
controls.minDistance = 25;

// Stars
{
  const g = new THREE.BufferGeometry();
  const n = 6000, pos = new Float32Array(n * 3);
  for (let i = 0; i < n; i++) {
    pos[i*3] = (Math.random()-0.5) * 12000;
    pos[i*3+1] = (Math.random()-0.5) * 6000;
    pos[i*3+2] = (Math.random()-0.5) * 12000;
  }
  g.setAttribute('position', new THREE.BufferAttribute(pos, 3));
  scene.add(new THREE.Points(g, new THREE.PointsMaterial({ color: 0xb4d2ff, size: 1.5, transparent: true, opacity: 0.6, sizeAttenuation: false, fog: false })));
}

const world = new THREE.Group();
scene.add(world);

// Text sprite helper
function textSprite(text, { size = 26, color = '#c8d4e8', mono = false } = {}) {
  const c = document.createElement('canvas'), x = c.getContext('2d');
  const font = `${mono ? '700' : '500'} ${size}px ${mono ? '"Space Mono", monospace' : '"Space Grotesk", sans-serif'}`;
  x.font = font;
  const w = Math.ceil(x.measureText(text).width) + 16;
  c.width = w * 2; c.height = (size + 18) * 2;
  x.scale(2, 2);
  x.font = font; x.fillStyle = color; x.textBaseline = 'middle';
  x.shadowColor = 'rgba(0,0,0,0.8)'; x.shadowBlur = 6;
  x.fillText(text, 8, (size + 18) / 2);
  const t = new THREE.CanvasTexture(c);
  t.colorSpace = THREE.SRGBColorSpace;
  const m = new THREE.Sprite(new THREE.SpriteMaterial({ map: t, transparent: true, depthWrite: false }));
  m.scale.set(w / 10 * LABEL_K, (size + 18) / 10 * LABEL_K, 1);
  return m;
}

// Layout constants
const LANE_Z = 20, GROUP_EXTRA = 18, STAGGER = 42, LABEL_K = 2.4;
const DEPTH = 24 * LANE_Z + 4 * GROUP_EXTRA;
let MONTH_W = 9; // set per era in build()
let halos = [];
function seeded(n) { const x = Math.sin(n * 12.9898) * 43758.5453; return x - Math.floor(x); }

let pickables = [], currentFocusId = null;

function dateX(year, month, day, y0, y1) {
  const years = y1 - y0 + 1;
  const total = years * 12 * MONTH_W;
  const t = ((year - y0) * 12 + (month - 1) + (day - 1) / 30.44) * MONTH_W;
  return t - total / 2;
}

function build() {
  world.clear();
  pickables = [];
  const [y0, y1] = ERAS[era];
  MONTH_W = (y1 - y0) > 0 ? 16 : 48;
  const events = ALL_EVENTS.filter(e => e.year >= y0 && e.year <= y1);
  const total = (y1 - y0 + 1) * 12 * MONTH_W;
  const xL = -total / 2, xR = total / 2;
  const posById = new Map();

  halos = [];
  let laneIdx = 0;
  GROUPS.forEach((grp, gi) => {
    grp.keys.forEach((key, li) => {
      const d = DOMAINS[key]; if (!d) { laneIdx++; return; }
      // Each lane gets its own depth; groups keep their front-to-back order with a small extra gap.
      const z = -(laneIdx * LANE_Z + gi * GROUP_EXTRA);
      // Staggered height: a non-repeating wave so neighbouring lanes never sit in a flat sheet.
      const y = Math.sin(laneIdx * 2.39996) * STAGGER + Math.cos(laneIdx * 0.9) * (STAGGER * 0.35);
      const col = new THREE.Color(d.color);

      if (li === 0) {
        const gl = textSprite(grp.name, { size: 30, color: '#8a9ab8', mono: true });
        gl.position.set(xL - 40, y + 26, z);
        world.add(gl);
      }
      // faint lane strand
      const lg = new THREE.BufferGeometry().setFromPoints([new THREE.Vector3(xL, y, z), new THREE.Vector3(xR, y, z)]);
      world.add(new THREE.Line(lg, new THREE.LineBasicMaterial({ color: col, transparent: true, opacity: 0.12 })));
      // lane label
      const ll = textSprite(d.label, { size: 20, color: d.color });
      ll.position.set(xL - 10 - ll.scale.x / 2, y + 5, z);
      world.add(ll);
      // events, scattered slightly off the strand like stars around a filament
      events.filter(e => e.domain === key).forEach(ev => {
        const x = dateX(ev.year, ev.month, ev.day, y0, y1);
        const jy = (seeded(ev.id) - 0.5) * 11;
        const jz = (seeded(ev.id * 7 + 3) - 0.5) * 15;
        const r = 1.7 + seeded(ev.id * 13 + 1) * 1.3;
        const mesh = new THREE.Mesh(
          new THREE.SphereGeometry(r, 18, 12),
          new THREE.MeshBasicMaterial({ color: col })
        );
        mesh.position.set(x, y + jy, z + jz);
        mesh.userData.ev = ev;
        world.add(mesh);
        pickables.push(mesh);
        const halo = new THREE.Sprite(new THREE.SpriteMaterial({ map: haloTex, color: col, transparent: true, opacity: 0.35, depthWrite: false }));
        halo.scale.set(7 * r, 7 * r, 1);
        halo.position.copy(mesh.position);
        halo.userData.phase = seeded(ev.id * 31) * Math.PI * 2;
        if (ev.art) { const ring = new THREE.Sprite(new THREE.SpriteMaterial({ map: ringTex, transparent: true, opacity: 0.85, depthWrite: false })); ring.scale.set(r * 5.2, r * 5.2, 1); ring.position.copy(mesh.position); world.add(ring); }
        world.add(halo);
        halos.push(halo);
        posById.set(ev.id, mesh.position.clone());
      });
      laneIdx++;
    });
  });

  // year markers floating in front of the cloud
  for (let yr = y0; yr <= y1; yr++) {
    const yx = dateX(yr, 1, 1, y0, y1);
    const yl = textSprite(String(yr), { size: 34, color: '#6a7a94', mono: true });
    yl.position.set(yx + (6 * MONTH_W), -STAGGER - 34, 40);
    world.add(yl);
  }

  // threads — glowing strands between connected events in view
  const drawn = new Set();
  events.forEach(ev => {
    (THREAD_MAP.get(ev.id) || new Set()).forEach(id2 => {
      const k = Math.min(ev.id, id2) + '-' + Math.max(ev.id, id2);
      if (drawn.has(k)) return; drawn.add(k);
      const a = posById.get(ev.id), b = posById.get(id2);
      if (a && !b) { threadStub(a, ALL_EVENTS.find(e => e.id === id2), y0); return; }
      if (!a || !b) return;
      const mid = a.clone().add(b).multiplyScalar(0.5);
      mid.y += Math.min(110, a.distanceTo(b) * 0.2 + 12);
      const curve = new THREE.QuadraticBezierCurve3(a, mid, b);
      const geo = new THREE.BufferGeometry().setFromPoints(curve.getPoints(40));
      world.add(new THREE.Line(geo, new THREE.LineBasicMaterial({ color: 0xcfd8ff, transparent: true, opacity: 0.5 })));
    });
  });
  if (typeof drawLife === 'function') drawLife();
}

// A thread whose other end lies outside the span on screen: a strand heading off the edge, labelled
function threadStub(from, other, y0) {
  if (!other) return;
  const dir = other.year < y0 ? -1 : 1;
  const end = from.clone().add(new THREE.Vector3(dir * 170, 80, 0));
  const mid = from.clone().lerp(end, 0.5); mid.y += 45;
  const geo = new THREE.BufferGeometry().setFromPoints(new THREE.QuadraticBezierCurve3(from, mid, end).getPoints(30));
  const ln = new THREE.Line(geo, new THREE.LineDashedMaterial({ color: 0xcfd8ff, dashSize: 5, gapSize: 4, transparent: true, opacity: 0.55 }));
  ln.computeLineDistances(); world.add(ln);
  const t = textSprite(`${dir < 0 ? '\u2190 ' : ''}${other.year} \u00b7 ${other.title}${dir > 0 ? ' \u2192' : ''}`, { size: 18, color: '#aab6d0' });
  t.position.copy(end).add(new THREE.Vector3(dir * t.scale.x / 2, 4, 0));
  world.add(t);
}

// halo texture
// a thin ring that marks works of art
const ringTex = (() => {
  const c = document.createElement('canvas'); c.width = c.height = 64;
  const x = c.getContext('2d');
  x.strokeStyle = 'rgba(255,255,255,0.95)'; x.lineWidth = 3.5;
  x.beginPath(); x.arc(32, 32, 26, 0, Math.PI * 2); x.stroke();
  return new THREE.CanvasTexture(c);
})();
const haloTex = (() => {
  const c = document.createElement('canvas'); c.width = c.height = 64;
  const x = c.getContext('2d');
  const g = x.createRadialGradient(32, 32, 0, 32, 32, 32);
  g.addColorStop(0, 'rgba(255,255,255,0.9)');
  g.addColorStop(0.35, 'rgba(255,255,255,0.25)');
  g.addColorStop(1, 'rgba(255,255,255,0)');
  x.fillStyle = g; x.fillRect(0, 0, 64, 64);

      pts.push(v.multiplyScalar(GR + 6 + Math.sin(Math.PI * f) * lift));
    }
    const line = new THREE.Line(new THREE.BufferGeometry().setFromPoints(pts), new THREE.LineBasicMaterial({ color: 0xcfe0ff, transparent: true, opacity: 0.12 }));
    line.userData = { ta: A.userData.t, tb: B.userData.t };
    globeDyn.add(line); globeArcs.push(line);
  }));
  updateGlobeTime(true);
}

function globeWindow() { return eraMonths() <= 12 ? 1.5 : 6; }
function updateGlobeTime(force) {
  if (!force && globeLastT === globeT) return;
  globeLastT = globeT;
  const W = globeWindow();
  const litPins = [];
  globePins.forEach(h => {
    const d = Math.abs(h.userData.t - globeT), lit = d <= W;
    h.userData.base = lit ? 1.35 : 0.7;
    if (h !== hovered) h.scale.setScalar(h.userData.base);
    h.material.opacity = lit ? 1 : 0.28;
    h.userData.stalk.material.opacity = lit ? 0.85 : 0.14;
    h.userData.halo.material.opacity = lit ? 0.55 * (1 - d / W * 0.6) : 0;
    if (h.userData.ring) h.userData.ring.material.opacity = lit ? 0.9 : 0.15;
    if (lit) litPins.push([d, h]);
  });
  globeArcs.forEach(l => {
    const lit = Math.abs(l.userData.ta - globeT) <= W || Math.abs(l.userData.tb - globeT) <= W;
    l.material.opacity = lit ? 0.85 : 0.05;
  });
  // name the events lit right now (nearest in time first)
  disposeGroup(globeLabels);
  litPins.sort((a, b) => a[0] - b[0]).slice(0, 14).forEach(([, h]) => {
    const e = h.userData.ev, p = placeOf(e);
    const t = textSprite(e.title, { size: 16, color: DOMAINS[e.domain].color });
    t.scale.multiplyScalar(0.55);
    t.position.copy(h.userData.tip.clone().setLength(h.userData.tip.length() + 9));
    globeLabels.add(t);
  });
}

function monthsLabel(m) {
  const [y0, y1] = ERAS[era];
  const mm = Math.max(0, Math.min(eraMonths() - 1, Math.floor(m)));
  return `${SHORT_M[mm % 12]} ${y0 + Math.floor(mm / 12)}`;
}

async function setMode(m) {
  if (m === mode) return;
  const { xL } = eraBounds();
  if (m === 'globe') {
    globeT = Math.max(0, Math.min(eraMonths(), (controls.target.x - xL) / MONTH_W));
    loomCam = { pos: camera.position.clone(), tgt: controls.target.clone() };
    mode = 'globe';
    world.visible = false; lifeGroup.visible = false; globeGroup.visible = true;
    await buildGlobeBase();
    if (globeEra !== era) buildGlobe(); else updateGlobeTime(true);
    controls.target.set(0, 0, 0);
    camera.position.copy(ll(18, 25, GR * 3.3));
    controls.autoRotate = true; controls.autoRotateSpeed = 0.35;
  } else {
    mode = 'loom';
    controls.autoRotate = false;
    world.visible = true; lifeGroup.visible = true; globeGroup.visible = false;
    if (loomCam) { camera.position.copy(loomCam.pos); controls.target.copy(loomCam.tgt); }
    const dx = xL + globeT * MONTH_W - controls.target.x;   // carry the date across
    controls.target.x += dx; camera.position.x += dx;
  }
  document.getElementById('modeBtn').innerHTML = mode === 'globe' ? '&#8801; Loom' : '&#9711; Globe';
  if (hovered) { hovered = null; tip.classList.remove('on'); }
  drawLife();
}
controls.addEventListener('start', () => { controls.autoRotate = false; });

function focusGlobe(e) {
  const p = placeOf(e); if (!p) return;
  globeT = evMonths(e); updateGlobeTime();
  controls.autoRotate = false;
  const dist = Math.max(GR * 1.9, camera.position.length());
  camera.position.copy(ll(p.lat, p.lon, dist));
}

// a person's journey: birthplace → the places of their events → where they died
function drawGlobePath() {
  disposeGroup(globePath);
  if (!lifeState || mode !== 'globe') return;
  const { title, L, evs } = lifeState;
  const stops = [];
  const add = (lat, lon, kind, text) => {
    if (lat == null || lon == null) return;
    const last = stops[stops.length - 1];
    if (last && Math.abs(last.lat - lat) < 0.05 && Math.abs(last.lon - lon) < 0.05) { if (kind !== 'ev') last.kind = kind, last.text = text; return; }
    stops.push({ lat, lon, kind, text });
  };
  if (L && L.born && L.born.place) add(L.born.place.lat, L.born.place.lon, 'born', `Born ${L.born.year} · ${WeftWho.fmtPlace(L.born.place)}`);
  evs.forEach(e => { const p = placeOf(e); if (p) add(p.lat, p.lon, 'ev', ''); });
  if (L && L.died && L.died.place) add(L.died.place.lat, L.died.place.lon, 'died', `Died ${L.died.year} · ${WeftWho.fmtPlace(L.died.place)}`);
  if (!stops.length) return;
  const GOLDc = new THREE.Color(0xe8c878);
  for (let i = 1; i < stops.length; i++) {
    const a = ll(stops[i - 1].lat, stops[i - 1].lon, 1), b = ll(stops[i].lat, stops[i].lon, 1), ang = a.angleTo(b);
    if (ang < 0.003) continue;
    const lift = Math.min(90, ang * GR * 0.4) + 4, pts = [];
    for (let j = 0; j <= 64; j++) {
      const f = j / 64;
      const v = a.clone().multiplyScalar(Math.sin((1 - f) * ang)).add(b.clone().multiplyScalar(Math.sin(f * ang))).divideScalar(Math.sin(ang));
      pts.push(v.multiplyScalar(GR + 3 + Math.sin(Math.PI * f) * lift));
    }
    globePath.add(new THREE.Mesh(new THREE.TubeGeometry(new THREE.CatmullRomCurve3(pts), 64, 0.7, 6, false), new THREE.MeshBasicMaterial({ color: GOLDc, transparent: true, opacity: 0.9 })));
  }
  stops.forEach(s => {
    const pos = ll(s.lat, s.lon, GR + 3);
    const big = s.kind !== 'ev';
    const m = new THREE.Mesh(new THREE.SphereGeometry(big ? 3.2 : 2, 16, 12), new THREE.MeshBasicMaterial({ color: s.kind === 'born' ? 0xffffff : GOLDc }));
    m.position.copy(pos); globePath.add(m);
    const h = new THREE.Sprite(new THREE.SpriteMaterial({ map: haloTex, color: GOLDc, transparent: true, opacity: big ? 0.7 : 0.4, depthWrite: false }));
    h.scale.set(big ? 26 : 14, big ? 26 : 14, 1); h.position.copy(pos); globePath.add(h);
    if (s.text) { const t = textSprite(s.text, { size: 18, color: '#e8c878' }); t.scale.multiplyScalar(0.6); t.position.copy(ll(s.lat, s.lon, GR + 16)); globePath.add(t); }
  });
  const name = textSprite(WEFT_PEOPLE[title].name, { size: 26, color: '#e8c878' }); name.scale.multiplyScalar(0.7);
  name.position.copy(ll(stops[0].lat, stops[0].lon, GR + 30)); globePath.add(name);
  // turn the planet to face the journey
  const key = 'g:' + title + (L ? ':L' : '');
  if (lifeState.gframed !== key) {
    lifeState.gframed = key;
    const c = new THREE.Vector3(); stops.forEach(s => c.add(ll(s.lat, s.lon, 1)));
    if (c.lengthSq() < 1e-6) c.copy(ll(stops[0].lat, stops[0].lon, 1));
    controls.autoRotate = false;
    camera.position.copy(c.normalize().multiplyScalar(Math.max(GR * 2.6, camera.position.length())));
  }
}

document.getElementById('modeBtn').addEventListener('click', () => setMode(mode === 'globe' ? 'loom' : 'globe'));

// ── DATA ───────────────────────────────────────────────────────────────────────
(async () => {
  try {
    const res = await fetch('weft-data.json', { cache: 'no-cache' });
    const data = await res.json();
    DOMAINS = data.domains;
    ALL_EVENTS = data.events;
    ALL_EVENTS.forEach(e => {
      (e.threads || []).forEach(t => {
        if (!THREAD_MAP.has(e.id)) THREAD_MAP.set(e.id, new Set());
        THREAD_MAP.get(e.id).add(t);
        if (!THREAD_MAP.has(t)) THREAD_MAP.set(t, new Set());
        THREAD_MAP.get(t).add(e.id);
      });
    });
    WEFT_PEOPLE = data.people || {};
    WEFT_PLACES = data.places || {};
    WeftWho.init(data, {
      onJump: id => { if (innerWidth < 700) WeftWho.close(); jumpTo(ALL_EVENTS.find(e => e.id === id)); },
      onPerson: (t, L, evs) => { lifeState = { title: t, L, evs }; drawLife(); },
      onClose: () => { lifeState = null; drawLife(); },
      onGlobe: async ev => { await setMode('globe'); focusGlobe(ev); },
    });
    setEra('modern', 1980);
    loop();
    document.getElementById('loading').classList.add('off');
  } catch (err) {
    document.getElementById('loading').textContent = 'Could not load weft-data.json';
  }
})();
</script>
