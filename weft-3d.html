<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#080c14">
<title>Weft 3D</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  :root { --bg:#080c14; --card:#131d2e; --border:rgba(255,255,255,0.08); --text:#c8d4e8; --dim:#5a6a80; --bright:#e8f0ff; }
  html, body { height: 100%; background: var(--bg); color: var(--text); font-family: 'Space Grotesk', system-ui, sans-serif; overflow: hidden; }
  @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600&family=Space+Mono:wght@400;700&display=swap');
  #scene { position: fixed; inset: 0; }
  #hud { position: fixed; top: 0; left: 0; right: 0; display: flex; align-items: center; justify-content: space-between; padding: 0.8rem 1.2rem; pointer-events: none; z-index: 5; }
  .hud-title { font-family: 'Space Mono', monospace; font-weight: 700; font-size: 1.6rem; letter-spacing: 0.1em; color: transparent; background: linear-gradient(135deg,#4a7fc0,#7a5ce0 50%,#c05ca0); -webkit-background-clip: text; background-clip: text; }
  .hud-sub { font-size: 0.6rem; color: var(--dim); letter-spacing: 0.08em; text-transform: uppercase; margin-top: 0.15rem; }
  .era-bar { display: flex; gap: 0.4rem; pointer-events: auto; }
  .era-btn, .hud-link { background: rgba(19,29,46,0.85); border: 1px solid var(--border); color: var(--dim); font-family: 'Space Mono', monospace; font-size: 0.65rem; padding: 0.5rem 0.9rem; border-radius: 8px; cursor: pointer; text-decoration: none; transition: all 0.15s; }
  .era-btn.active { background: rgba(122,92,224,0.3); color: var(--bright); border-color: rgba(122,92,224,0.5); }
  .era-btn:hover, .hud-link:hover { color: var(--bright); }
  #help { position: fixed; bottom: 0.8rem; left: 1.2rem; font-family: 'Space Mono', monospace; font-size: 0.55rem; color: var(--dim); z-index: 5; pointer-events: none; }
  #tip { position: fixed; z-index: 10; background: var(--card); border: 1px solid var(--border); border-radius: 8px; padding: 0.5rem 0.7rem; pointer-events: none; opacity: 0; transition: opacity 0.1s; max-width: 260px; box-shadow: 0 6px 24px rgba(0,0,0,0.5); }
  #tip.on { opacity: 1; }
  .tip-t { font-size: 0.75rem; font-weight: 600; color: var(--bright); }
  .tip-d { font-family: 'Space Mono', monospace; font-size: 0.55rem; color: var(--dim); margin-top: 0.2rem; }
  #card { position: fixed; top: 70px; right: 1rem; width: 340px; max-width: calc(100vw - 2rem); max-height: calc(100vh - 120px); overflow-y: auto; background: rgba(19,29,46,0.96); border: 1px solid var(--border); border-radius: 14px; padding: 1.1rem 1.2rem; z-index: 8; display: none; backdrop-filter: blur(6px); }
  #card.on { display: block; }
  .card-close { position: absolute; top: 0.5rem; right: 0.7rem; background: none; border: none; color: var(--dim); font-size: 1.1rem; cursor: pointer; }
  .card-dom { display: flex; align-items: center; gap: 0.4rem; font-family: 'Space Mono', monospace; font-size: 0.58rem; text-transform: uppercase; letter-spacing: 0.1em; margin-bottom: 0.4rem; }
  .card-title { font-size: 1.05rem; font-weight: 600; color: var(--bright); line-height: 1.3; }
  .card-date { font-family: 'Space Mono', monospace; font-size: 0.58rem; color: var(--dim); margin: 0.25rem 0 0.7rem; }
  .card-body { font-size: 0.78rem; line-height: 1.6; }
  .card-link { display: inline-block; margin-top: 0.8rem; font-family: 'Space Mono', monospace; font-size: 0.62rem; padding: 0.35rem 0.7rem; border: 1px solid; border-radius: 6px; text-decoration: none; }
  .card-threads { margin-top: 0.9rem; display: flex; flex-wrap: wrap; gap: 0.35rem; }
  .ct-label { width: 100%; font-family: 'Space Mono', monospace; font-size: 0.55rem; letter-spacing: 0.12em; text-transform: uppercase; color: var(--dim); }
  .ct-chip { display: inline-flex; align-items: center; gap: 0.35rem; background: rgba(255,255,255,0.04); border: 1px solid var(--border); color: var(--text); font-size: 0.66rem; padding: 0.3rem 0.55rem; border-radius: 14px; cursor: pointer; font-family: inherit; text-align: left; }
  .ct-chip:hover { border-color: rgba(255,255,255,0.3); }
  .ct-dot { width: 7px; height: 7px; border-radius: 50%; flex-shrink: 0; }
  .ct-year { font-family: 'Space Mono', monospace; font-size: 0.55rem; color: var(--dim); }
  #loading { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; background: var(--bg); z-index: 20; font-family: 'Space Mono', monospace; letter-spacing: 0.15em; color: var(--bright); transition: opacity 0.4s; }
  #loading.off { opacity: 0; pointer-events: none; }
</style>
</head>
<body>
<div id="loading">WEFT&nbsp;3D</div>
<canvas id="scene"></canvas>
<div id="hud">
  <div><div class="hud-title">WEFT</div><div class="hud-sub">The loom &middot; drag to orbit &middot; scroll to zoom &middot; right-drag to pan</div></div>
  <div class="era-bar">
    <button class="era-btn" data-era="1492">1492</button>
    <button class="era-btn" data-era="1776">1776</button>
    <button class="era-btn active" data-era="1980s">1980s</button>
    <a class="hud-link" href="index.html">2D &rarr;</a>
  </div>
</div>
<div id="help">click an event for its story &middot; bright strands are threads</div>
<div id="tip"><div class="tip-t"></div><div class="tip-d"></div></div>
<div id="card">
  <button class="card-close" id="cardClose">&#10005;</button>
  <div class="card-dom"><span id="cDomIcon"></span><span id="cDomLabel"></span></div>
  <div class="card-title" id="cTitle"></div>
  <div class="card-date" id="cDate"></div>
  <div class="card-body" id="cBody"></div>
  <a class="card-link" id="cWiki" target="_blank" rel="noopener">&rarr; Wikipedia</a>
  <div class="card-threads" id="cThreads"></div>
</div>

<script type="importmap">
{ "imports": { "three": "./vendor/three.module.js", "three/addons/controls/OrbitControls.js": "./vendor/OrbitControls.js" } }
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

const MONTH_NAMES = ['January','February','March','April','May','June','July','August','September','October','November','December'];
const GROUPS = [
  { name: 'POWER & MONEY',  keys: ['politics','conflict','economics','law'] },
  { name: 'SCIENCE',        keys: ['space','physics','biology','earth','disasters'] },
  { name: 'MAKING & MOVING',keys: ['tech','transport','exploration','games'] },
  { name: 'ARTS',           keys: ['visualart','theatre','music','film','literature','architecture','fashion'] },
  { name: 'LIFE',           keys: ['food','religion','sport','people','society'] },
];
const ERAS = { '1492': [1492,1492], '1776': [1776,1776], '1980s': [1980,1989] };

let DOMAINS = {}, ALL_EVENTS = [], THREAD_MAP = new Map();
let era = '1980s';

// ── SCENE ──────────────────────────────────────────────────────────────────────
const canvas = document.getElementById('scene');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x080c14);
scene.fog = new THREE.Fog(0x080c14, 420, 1400);
const camera = new THREE.PerspectiveCamera(55, 1, 0.1, 3000);
camera.position.set(40, 120, 330);
const controls = new OrbitControls(camera, canvas);
controls.enableDamping = true;
controls.dampingFactor = 0.08;
controls.maxDistance = 900;
controls.minDistance = 20;

// Stars
{
  const g = new THREE.BufferGeometry();
  const n = 1600, pos = new Float32Array(n * 3);
  for (let i = 0; i < n; i++) {
    pos[i*3] = (Math.random()-0.5) * 1400;
    pos[i*3+1] = (Math.random()-0.5) * 900;
    pos[i*3+2] = (Math.random()-0.5) * 1400;
  }
  g.setAttribute('position', new THREE.BufferAttribute(pos, 3));
  scene.add(new THREE.Points(g, new THREE.PointsMaterial({ color: 0xb4d2ff, size: 1.1, transparent: true, opacity: 0.55, sizeAttenuation: true })));
}

const world = new THREE.Group();
scene.add(world);

// Text sprite helper
function textSprite(text, { size = 26, color = '#c8d4e8', mono = false } = {}) {
  const c = document.createElement('canvas'), x = c.getContext('2d');
  const font = `${mono ? '700' : '500'} ${size}px ${mono ? '"Space Mono", monospace' : '"Space Grotesk", sans-serif'}`;
  x.font = font;
  const w = Math.ceil(x.measureText(text).width) + 16;
  c.width = w * 2; c.height = (size + 18) * 2;
  x.scale(2, 2);
  x.font = font; x.fillStyle = color; x.textBaseline = 'middle';
  x.shadowColor = 'rgba(0,0,0,0.8)'; x.shadowBlur = 6;
  x.fillText(text, 8, (size + 18) / 2);
  const t = new THREE.CanvasTexture(c);
  t.colorSpace = THREE.SRGBColorSpace;
  const m = new THREE.Sprite(new THREE.SpriteMaterial({ map: t, transparent: true, depthWrite: false }));
  m.scale.set(w / 10, (size + 18) / 10, 1);
  return m;
}

// Layout constants
const LANE_GAP = 7, GROUP_GAP = 34;
let MONTH_W = 9; // set per era in build()

let pickables = [], currentFocusId = null;

function dateX(year, month, day, y0, y1) {
  const years = y1 - y0 + 1;
  const total = years * 12 * MONTH_W;
  const t = ((year - y0) * 12 + (month - 1) + (day - 1) / 30.44) * MONTH_W;
  return t - total / 2;
}

function build() {
  world.clear();
  pickables = [];
  const [y0, y1] = ERAS[era];
  MONTH_W = (y1 - y0) > 0 ? 5 : 14;
  const events = ALL_EVENTS.filter(e => e.year >= y0 && e.year <= y1);
  const total = (y1 - y0 + 1) * 12 * MONTH_W;
  const xL = -total / 2, xR = total / 2;
  const posById = new Map();

  GROUPS.forEach((grp, gi) => {
    const z = -gi * GROUP_GAP;
    const gh = (grp.keys.length - 1) * LANE_GAP;
    // group label
    const gl = textSprite(grp.name, { size: 30, color: '#8a9ab8', mono: true });
    gl.position.set(xL - 14, gh / 2 + 12, z);
    world.add(gl);

    grp.keys.forEach((key, li) => {
      const d = DOMAINS[key]; if (!d) return;
      const y = gh / 2 - li * LANE_GAP;
      const col = new THREE.Color(d.color);
      // lane line
      const lg = new THREE.BufferGeometry().setFromPoints([new THREE.Vector3(xL, y, z), new THREE.Vector3(xR, y, z)]);
      world.add(new THREE.Line(lg, new THREE.LineBasicMaterial({ color: col, transparent: true, opacity: 0.28 })));
      // lane label
      const ll = textSprite(d.label, { size: 20, color: d.color });
      ll.position.set(xL - 4 - ll.scale.x / 2, y + 2.2, z);
      world.add(ll);
      // events
      events.filter(e => e.domain === key).forEach(ev => {
        const x = dateX(ev.year, ev.month, ev.day, y0, y1);
        const mesh = new THREE.Mesh(
          new THREE.SphereGeometry(1.35, 20, 14),
          new THREE.MeshBasicMaterial({ color: col })
        );
        mesh.position.set(x, y, z);
        mesh.userData.ev = ev;
        world.add(mesh);
        pickables.push(mesh);
        // soft halo
        const halo = new THREE.Sprite(new THREE.SpriteMaterial({ map: haloTex, color: col, transparent: true, opacity: 0.35, depthWrite: false }));
        halo.scale.set(7, 7, 1);
        halo.position.copy(mesh.position);
        world.add(halo);
        posById.set(ev.id, mesh.position.clone());
      });
    });
  });

  // year/month markers along the front
  const frontZ = 10;
  for (let yr = y0; yr <= y1; yr++) {
    const yx = dateX(yr, 1, 1, y0, y1);
    const yl = textSprite(String(yr), { size: 22, color: '#5a6a80', mono: true });
    yl.position.set(yx + (6 * MONTH_W), -((GROUPS[0].keys.length - 1) * LANE_GAP) / 2 - 10, 0);
    world.add(yl);
  }

  // threads — glowing strands between connected events in view
  const drawn = new Set();
  events.forEach(ev => {
    (THREAD_MAP.get(ev.id) || new Set()).forEach(id2 => {
      const k = Math.min(ev.id, id2) + '-' + Math.max(ev.id, id2);
      if (drawn.has(k)) return; drawn.add(k);
      const a = posById.get(ev.id), b = posById.get(id2);
      if (!a || !b) return;
      const mid = a.clone().add(b).multiplyScalar(0.5);
      mid.y += Math.min(26, a.distanceTo(b) * 0.22 + 4);
      const curve = new THREE.QuadraticBezierCurve3(a, mid, b);
      const geo = new THREE.BufferGeometry().setFromPoints(curve.getPoints(40));
      world.add(new THREE.Line(geo, new THREE.LineBasicMaterial({ color: 0xcfd8ff, transparent: true, opacity: 0.5 })));
    });
  });
}

// halo texture
const haloTex = (() => {
  const c = document.createElement('canvas'); c.width = c.height = 64;
  const x = c.getContext('2d');
  const g = x.createRadialGradient(32, 32, 0, 32, 32, 32);
  g.addColorStop(0, 'rgba(255,255,255,0.9)');
  g.addColorStop(0.35, 'rgba(255,255,255,0.25)');
  g.addColorStop(1, 'rgba(255,255,255,0)');
  x.fillStyle = g; x.fillRect(0, 0, 64, 64);
  return new THREE.CanvasTexture(c);
})();

// ── PICKING ────────────────────────────────────────────────────────────────────
const ray = new THREE.Raycaster();
const mouse = new THREE.Vector2(-2, -2);
let hovered = null;
canvas.addEventListener('pointermove', e => {
  mouse.set((e.clientX / innerWidth) * 2 - 1, -(e.clientY / innerHeight) * 2 + 1);
  tipXY = [e.clientX, e.clientY];
});
let tipXY = [0, 0];
canvas.addEventListener('click', () => { if (hovered) openCard(hovered.userData.ev); });

const tip = document.getElementById('tip');
function updateHover() {
  ray.setFromCamera(mouse, camera);
  const hit = ray.intersectObjects(pickables, false)[0];
  const obj = hit ? hit.object : null;
  if (obj !== hovered) {
    if (hovered) hovered.scale.setScalar(1);
    hovered = obj;
    if (hovered) {
      hovered.scale.setScalar(1.8);
      const ev = hovered.userData.ev;
      tip.querySelector('.tip-t').textContent = ev.title;
      tip.querySelector('.tip-d').textContent = `${ev.day} ${MONTH_NAMES[ev.month-1]} ${ev.year} · ${DOMAINS[ev.domain].label}`;
      tip.classList.add('on');
      canvas.style.cursor = 'pointer';
    } else { tip.classList.remove('on'); canvas.style.cursor = 'grab'; }
  }
  if (hovered) {
    tip.style.left = Math.min(tipXY[0] + 14, innerWidth - 270) + 'px';
    tip.style.top = (tipXY[1] + 14) + 'px';
  }
}

// ── CARD ───────────────────────────────────────────────────────────────────────
const card = document.getElementById('card');
document.getElementById('cardClose').addEventListener('click', () => { card.classList.remove('on'); currentFocusId = null; });
function openCard(ev) {
  currentFocusId = ev.id;
  const d = DOMAINS[ev.domain];
  document.getElementById('cDomIcon').textContent = d.icon;
  const dl = document.getElementById('cDomLabel'); dl.textContent = d.label; dl.style.color = d.color;
  document.getElementById('cTitle').textContent = ev.title;
  document.getElementById('cDate').textContent = `${ev.day} ${MONTH_NAMES[ev.month-1]} ${ev.year}`;
  document.getElementById('cBody').textContent = ev.body;
  const w = document.getElementById('cWiki');
  if (ev.wiki) { w.style.display = 'inline-block'; w.href = ev.wiki; w.style.borderColor = d.color + '44'; w.style.color = d.color; }
  else w.style.display = 'none';
  const ct = document.getElementById('cThreads'); ct.innerHTML = '';
  const linked = [...(THREAD_MAP.get(ev.id) || [])].map(i => ALL_EVENTS.find(e => e.id === i)).filter(Boolean)
    .sort((a,b) => (a.year*10000+a.month*100+a.day) - (b.year*10000+b.month*100+b.day));
  if (linked.length) {
    const lab = document.createElement('div'); lab.className = 'ct-label'; lab.textContent = 'Threads'; ct.appendChild(lab);
    linked.forEach(e2 => {
      const chip = document.createElement('button'); chip.className = 'ct-chip';
      chip.innerHTML = `<span class="ct-dot" style="background:${DOMAINS[e2.domain].color}"></span><span>${e2.title}</span><span class="ct-year">${e2.year}</span>`;
      chip.addEventListener('click', () => {
        const [y0, y1] = ERAS[era];
        if (e2.year < y0 || e2.year > y1) {
          const target = Object.entries(ERAS).find(([, [a, b]]) => e2.year >= a && e2.year <= b);
          if (target) setEra(target[0]);
        }
        openCard(e2);
        focusEvent(e2);
      });
      ct.appendChild(chip);
    });
  }
  card.classList.add('on');
}

function focusEvent(ev) {
  const mesh = pickables.find(m => m.userData.ev.id === ev.id);
  if (!mesh) return;
  const p = mesh.position;
  controls.target.copy(p);
  const dir = camera.position.clone().sub(controls.target).normalize();
  camera.position.copy(p.clone().add(dir.multiplyScalar(60)));
}

// ── ERA ────────────────────────────────────────────────────────────────────────
function setEra(e) {
  era = e;
  document.querySelectorAll('.era-btn').forEach(b => b.classList.toggle('active', b.dataset.era === e));
  build();
  controls.target.set(0, 0, -GROUP_GAP * 1.6);
  camera.position.set(40, 120, 330);
  card.classList.remove('on');
}
document.querySelectorAll('.era-btn').forEach(b => b.addEventListener('click', () => setEra(b.dataset.era)));

// ── RESIZE / LOOP ──────────────────────────────────────────────────────────────
function resize() {
  renderer.setSize(innerWidth, innerHeight);
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
}
addEventListener('resize', resize);
resize();

function loop() {
  controls.update();
  updateHover();
  renderer.render(scene, camera);
  requestAnimationFrame(loop);
}

// ── DATA ───────────────────────────────────────────────────────────────────────
(async () => {
  try {
    const res = await fetch('weft-data.json');
    const data = await res.json();
    DOMAINS = data.domains;
    ALL_EVENTS = data.events;
    ALL_EVENTS.forEach(e => {
      (e.threads || []).forEach(t => {
        if (!THREAD_MAP.has(e.id)) THREAD_MAP.set(e.id, new Set());
        THREAD_MAP.get(e.id).add(t);
        if (!THREAD_MAP.has(t)) THREAD_MAP.set(t, new Set());
        THREAD_MAP.get(t).add(e.id);
      });
    });
    setEra('1980s');
    loop();
    document.getElementById('loading').classList.add('off');
  } catch (err) {
    document.getElementById('loading').textContent = 'Could not load weft-data.json';
  }
})();
</script>
</body>
</html>
