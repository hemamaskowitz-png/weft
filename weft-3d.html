<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#080c14">
<title>Weft 3D</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  :root { --bg:#080c14; --card:#131d2e; --border:rgba(255,255,255,0.08); --text:#c8d4e8; --dim:#5a6a80; --bright:#e8f0ff; }
  html, body { height: 100%; background: var(--bg); color: var(--text); font-family: 'Space Grotesk', system-ui, sans-serif; overflow: hidden; }
  @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600&family=Space+Mono:wght@400;700&display=swap');
  #scene { position: fixed; inset: 0; }
  #hud { position: fixed; top: 0; left: 0; right: 0; display: flex; align-items: center; justify-content: space-between; padding: 0.8rem 1.2rem; pointer-events: none; z-index: 5; }
  .hud-title { font-family: 'Space Mono', monospace; font-weight: 700; font-size: 1.6rem; letter-spacing: 0.1em; color: transparent; background: linear-gradient(135deg,#4a7fc0,#7a5ce0 50%,#c05ca0); -webkit-background-clip: text; background-clip: text; }
  .hud-sub { font-size: 0.6rem; color: var(--dim); letter-spacing: 0.08em; text-transform: uppercase; margin-top: 0.15rem; }
  .era-bar { display: flex; gap: 0.4rem; pointer-events: auto; }
  .era-btn, .hud-link { background: rgba(19,29,46,0.85); border: 1px solid var(--border); color: var(--dim); font-family: 'Space Mono', monospace; font-size: 0.65rem; padding: 0.5rem 0.9rem; border-radius: 8px; cursor: pointer; text-decoration: none; transition: all 0.15s; }
  .era-btn.active { background: rgba(122,92,224,0.3); color: var(--bright); border-color: rgba(122,92,224,0.5); }
  .era-btn:hover, .hud-link:hover { color: var(--bright); }
  #help { position: fixed; bottom: 0.8rem; left: 1.2rem; font-family: 'Space Mono', monospace; font-size: 0.55rem; color: var(--dim); z-index: 5; pointer-events: none; }
  #tip { position: fixed; z-index: 10; background: var(--card); border: 1px solid var(--border); border-radius: 8px; padding: 0.5rem 0.7rem; pointer-events: none; opacity: 0; transition: opacity 0.1s; max-width: 260px; box-shadow: 0 6px 24px rgba(0,0,0,0.5); }
  #tip.on { opacity: 1; }
  .tip-t { font-size: 0.75rem; font-weight: 600; color: var(--bright); }
  .tip-d { font-family: 'Space Mono', monospace; font-size: 0.55rem; color: var(--dim); margin-top: 0.2rem; }
  #card { position: fixed; top: 70px; right: 1rem; width: 340px; max-width: calc(100vw - 2rem); max-height: calc(100vh - 120px); overflow-y: auto; background: rgba(19,29,46,0.96); border: 1px solid var(--border); border-radius: 14px; padding: 1.1rem 1.2rem; z-index: 8; display: none; backdrop-filter: blur(6px); }
  #card.on { display: block; }
  .card-close { position: absolute; top: 0.5rem; right: 0.7rem; background: none; border: none; color: var(--dim); font-size: 1.1rem; cursor: pointer; }
  .card-dom { display: flex; align-items: center; gap: 0.4rem; font-family: 'Space Mono', monospace; font-size: 0.58rem; text-transform: uppercase; letter-spacing: 0.1em; margin-bottom: 0.4rem; }
  .card-title { font-size: 1.05rem; font-weight: 600; color: var(--bright); line-height: 1.3; }
  .card-date { font-family: 'Space Mono', monospace; font-size: 0.58rem; color: var(--dim); margin: 0.25rem 0 0.7rem; }
  .card-body { font-size: 0.78rem; line-height: 1.6; }
  .card-link { display: inline-block; margin-top: 0.8rem; font-family: 'Space Mono', monospace; font-size: 0.62rem; padding: 0.35rem 0.7rem; border: 1px solid; border-radius: 6px; text-decoration: none; }
  .card-threads { margin-top: 0.9rem; display: flex; flex-wrap: wrap; gap: 0.35rem; }
  .ct-label { width: 100%; font-family: 'Space Mono', monospace; font-size: 0.55rem; letter-spacing: 0.12em; text-transform: uppercase; color: var(--dim); }
  .ct-chip { display: inline-flex; align-items: center; gap: 0.35rem; background: rgba(255,255,255,0.04); border: 1px solid var(--border); color: var(--text); font-size: 0.66rem; padding: 0.3rem 0.55rem; border-radius: 14px; cursor: pointer; font-family: inherit; text-align: left; }
  .ct-chip:hover { border-color: rgba(255,255,255,0.3); }
  .ct-dot { width: 7px; height: 7px; border-radius: 50%; flex-shrink: 0; }
  .ct-year { font-family: 'Space Mono', monospace; font-size: 0.55rem; color: var(--dim); }
  /* NAV SLIDERS — bottom right */
  #nav { position: fixed; right: 1.2rem; bottom: 1rem; z-index: 6; display: flex; align-items: flex-end; gap: 0.5rem; }
  .nav-time, .nav-zoom { background: rgba(19,29,46,0.78); border: 1px solid var(--border); border-radius: 14px; backdrop-filter: blur(6px); }
  .nav-time { display: flex; flex-direction: column; gap: 0.45rem; width: 320px; max-width: 60vw; padding: 0.7rem 1rem 0.85rem; }
  .nav-zoom { padding: 0.6rem 0.5rem; }
  .nav-label { display: flex; justify-content: space-between; font-family: 'Space Mono', monospace; font-size: 0.55rem; letter-spacing: 0.1em; text-transform: uppercase; color: var(--dim); }
  .nav-label b { color: var(--bright); font-weight: 700; letter-spacing: 0.05em; }
  .nav-zoom { display: flex; flex-direction: column; align-items: center; gap: 0.3rem; }
  .zoom-track { width: 22px; height: 120px; position: relative; }
  .zoom-track input { position: absolute; width: 120px; left: 50%; top: 50%; transform: translate(-50%, -50%) rotate(-90deg); }
  .zoom-ico { font-family: 'Space Mono', monospace; font-size: 0.8rem; color: var(--dim); line-height: 1; user-select: none; }
  #nav input[type=range] { -webkit-appearance: none; appearance: none; height: 4px; border-radius: 2px; background: rgba(255,255,255,0.12); outline: none; cursor: pointer; margin: 0; }
  #nav input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; width: 16px; height: 16px; border-radius: 50%; background: radial-gradient(circle at 35% 35%, #c0b0ff, #7a5ce0); box-shadow: 0 0 10px rgba(122,92,224,0.7); border: none; }
  #nav input[type=range]::-moz-range-thumb { width: 16px; height: 16px; border-radius: 50%; background: radial-gradient(circle at 35% 35%, #c0b0ff, #7a5ce0); box-shadow: 0 0 10px rgba(122,92,224,0.7); border: none; }
  @media (max-width: 600px) {
    #nav { right: 0.6rem; bottom: 0.6rem; left: 0.6rem; justify-content: flex-end; }
    .nav-time { flex: 1; max-width: none; width: auto; }
    .zoom-track { height: 90px; } .zoom-track input { width: 90px; }
    #help { display: none; }
    #hud { flex-direction: column; align-items: stretch; gap: 0.5rem; padding: 0.7rem 0.6rem; }
    .hud-sub { display: none; }
    .era-bar { overflow-x: auto; scrollbar-width: none; padding-bottom: 2px; }
    .era-bar::-webkit-scrollbar { display: none; }
    .era-btn, .hud-link { flex-shrink: 0; padding: 0.45rem 0.7rem; }
    #card { top: auto; bottom: 150px; right: 0.6rem; left: 0.6rem; width: auto; max-height: 50vh; }
  }

  #loading { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; background: var(--bg); z-index: 20; font-family: 'Space Mono', monospace; letter-spacing: 0.15em; color: var(--bright); transition: opacity 0.4s; }
  #loading.off { opacity: 0; pointer-events: none; }
</style>
</head>

<style>
  /* People & places — shared by 2D and 3D */
  .who-row { margin-top: 0.9rem; display: flex; flex-wrap: wrap; gap: 0.35rem; align-items: center; }
  .who-label { width: 100%; font-family: 'Space Mono', monospace; font-size: 0.55rem; letter-spacing: 0.12em; text-transform: uppercase; color: #5a6a80; }
  .who-chip { display: inline-flex; align-items: center; gap: 0.35rem; background: rgba(255,255,255,0.04); border: 1px solid rgba(255,255,255,0.1); color: #c8d4e8; font-size: 0.68rem; padding: 0.3rem 0.6rem; border-radius: 14px; cursor: pointer; font-family: 'Space Grotesk', system-ui, sans-serif; text-align: left; transition: border-color 0.15s, background 0.15s; }
  .who-chip:hover { border-color: rgba(232,200,120,0.6); background: rgba(232,200,120,0.08); }
  .who-chip .wi { font-size: 0.75rem; line-height: 1; }
  .who-chip.place { border-style: dashed; }

  #whoPanel { position: fixed; top: 70px; left: 1rem; width: 350px; max-width: calc(100vw - 2rem); max-height: calc(100vh - 100px); overflow-y: auto; z-index: 300; background: rgba(15,22,36,0.97); border: 1px solid rgba(232,200,120,0.28); border-radius: 16px; padding: 1.1rem 1.2rem 1.2rem; display: none; box-shadow: 0 12px 48px rgba(0,0,0,0.6); backdrop-filter: blur(8px); font-family: 'Space Grotesk', system-ui, sans-serif; color: #c8d4e8; }
  #whoPanel.on { display: block; }
  #whoPanel .wp-close { position: absolute; top: 0.55rem; right: 0.75rem; background: none; border: none; color: #5a6a80; font-size: 1.1rem; cursor: pointer; }
  #whoPanel .wp-close:hover { color: #e8f0ff; }
  .wp-kind { font-family: 'Space Mono', monospace; font-size: 0.55rem; letter-spacing: 0.14em; text-transform: uppercase; color: #e8c878; margin-bottom: 0.35rem; }
  .wp-name { font-size: 1.25rem; font-weight: 600; color: #e8f0ff; line-height: 1.2; padding-right: 1.2rem; }
  .wp-desc { font-size: 0.8rem; color: #8a9ab8; margin-top: 0.3rem; line-height: 1.45; }
  .wp-life { margin-top: 0.9rem; display: grid; grid-template-columns: auto 1fr; gap: 0.45rem 0.7rem; align-items: start; }
  .wp-life .k { font-family: 'Space Mono', monospace; font-size: 0.55rem; letter-spacing: 0.1em; text-transform: uppercase; color: #5a6a80; padding-top: 0.15rem; }
  .wp-life .v { font-size: 0.8rem; line-height: 1.4; }
  .wp-life .v small { display: block; color: #8a9ab8; font-size: 0.7rem; }
  .wp-life .v button { background: none; border: none; padding: 0; color: #e8c878; font: inherit; cursor: pointer; text-decoration: underline; text-decoration-color: rgba(232,200,120,0.35); text-underline-offset: 2px; }
  .wp-loading { font-family: 'Space Mono', monospace; font-size: 0.6rem; color: #5a6a80; margin-top: 0.9rem; }
  .wp-bar { position: relative; height: 4px; border-radius: 2px; background: rgba(255,255,255,0.07); margin: 0.9rem 0 0.2rem; }
  .wp-bar .span { position: absolute; top: 0; bottom: 0; border-radius: 2px; background: linear-gradient(90deg, #e8c878, #c8a05c); }
  .wp-bar .tick { position: absolute; top: -3px; width: 2px; height: 10px; background: #e8f0ff; border-radius: 1px; }
  .wp-bar-l { display: flex; justify-content: space-between; font-family: 'Space Mono', monospace; font-size: 0.52rem; color: #5a6a80; }
  .wp-sec { margin-top: 1rem; font-family: 'Space Mono', monospace; font-size: 0.55rem; letter-spacing: 0.12em; text-transform: uppercase; color: #5a6a80; }
  .wp-events { margin-top: 0.45rem; display: flex; flex-direction: column; gap: 0.3rem; }
  .wp-ev { display: grid; grid-template-columns: 10px 1fr auto; gap: 0.55rem; align-items: center; background: rgba(255,255,255,0.03); border: 1px solid rgba(255,255,255,0.07); border-radius: 9px; padding: 0.45rem 0.6rem; cursor: pointer; text-align: left; color: #c8d4e8; font: inherit; font-size: 0.74rem; }
  .wp-ev:hover { border-color: rgba(255,255,255,0.25); }
  .wp-ev .d { width: 8px; height: 8px; border-radius: 50%; }
  .wp-ev .y { font-family: 'Space Mono', monospace; font-size: 0.58rem; color: #5a6a80; }
  .wp-ev.life { cursor: default; border-style: dashed; color: #e8c878; }
  .wp-link { display: inline-block; margin-top: 1rem; font-family: 'Space Mono', monospace; font-size: 0.6rem; padding: 0.35rem 0.7rem; border: 1px solid rgba(232,200,120,0.35); color: #e8c878; border-radius: 6px; text-decoration: none; }
  .wp-note { margin-top: 0.8rem; font-size: 0.62rem; color: #5a6a80; line-height: 1.4; }
  @media (max-width: 700px) {
    #whoPanel { top: auto; bottom: 0; left: 0; right: 0; width: auto; max-width: none; max-height: 72vh; border-radius: 18px 18px 0 0; }
  }
</style>
<div id="whoPanel" role="dialog" aria-label="Person or place"><button class="wp-close" aria-label="Close">&#10005;</button><div id="whoBody"></div></div>
<script>
// ── WEFT WHO: people & places ─────────────────────────────────────────────────
// Birth and death details come live from Wikidata, so they are sourced, not typed in.
window.WeftWho = (() => {
  const M = ['January','February','March','April','May','June','July','August','September','October','November','December'];
  let D = null, onJump = () => {}, onPerson = () => {}, onClose = () => {};
  const lifeCache = new Map();
  const panel = () => document.getElementById('whoPanel');
  const body = () => document.getElementById('whoBody');
  const esc = s => String(s == null ? '' : s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

  function init(data, hooks = {}) {
    D = data;
    onJump = hooks.onJump || onJump; onPerson = hooks.onPerson || onPerson; onClose = hooks.onClose || onClose;
    panel().querySelector('.wp-close').addEventListener('click', close);
    document.addEventListener('keydown', e => { if (e.key === 'Escape' && panel().classList.contains('on')) { e.stopPropagation(); close(); } }, true);
  }
  function close() { panel().classList.remove('on'); onClose(); }

  // ── Wikidata ──
  async function getJSON(url) { const r = await fetch(url); if (!r.ok) throw new Error(r.status); return r.json(); }
  function claim(ent, p) {
    const c = ent && ent.claims && ent.claims[p]; if (!c || !c.length) return null;
    const best = c.find(x => x.rank === 'preferred') || c.find(x => x.rank !== 'deprecated') || c[0];
    return best.mainsnak && best.mainsnak.datavalue ? best.mainsnak.datavalue.value : null;
  }
  function parseTime(v) {
    if (!v || !v.time) return null;
    const m = v.time.match(/^([+-])(\d+)-(\d\d)-(\d\d)/); if (!m) return null;
    const year = (m[1] === '-' ? -1 : 1) * parseInt(m[2], 10);
    return { year, month: v.precision >= 10 && +m[3] ? +m[3] : null, day: v.precision >= 11 && +m[4] ? +m[4] : null };
  }
  async function lookup(title) {
    const pp = await getJSON(`https://en.wikipedia.org/w/api.php?action=query&prop=pageprops&ppprop=wikibase_item&redirects=1&format=json&origin=*&titles=${encodeURIComponent(title.replace(/_/g, ' '))}`);
    const pg = pp.query && pp.query.pages && Object.values(pp.query.pages)[0];
    const qid = pg && pg.pageprops && pg.pageprops.wikibase_item; if (!qid) return null;
    const ent = (await getJSON(`https://www.wikidata.org/w/api.php?action=wbgetentities&ids=${qid}&props=claims&format=json&origin=*`)).entities[qid];
    const born = parseTime(claim(ent, 'P569')), died = parseTime(claim(ent, 'P570'));
    const bp = claim(ent, 'P19'), dp = claim(ent, 'P20');
    const ids = [...new Set([bp && bp.id, dp && dp.id].filter(Boolean))];
    const pl = {};
    if (ids.length) {
      const pe = (await getJSON(`https://www.wikidata.org/w/api.php?action=wbgetentities&ids=${ids.join('|')}&props=labels|claims&languages=en&format=json&origin=*`)).entities;
      const cids = new Set();
      for (const [id, e] of Object.entries(pe)) {
        const co = claim(e, 'P625'), ct = claim(e, 'P17');
        pl[id] = { name: e.labels && e.labels.en ? e.labels.en.value : null, lat: co ? co.latitude : null, lon: co ? co.longitude : null, countryId: ct ? ct.id : null };
        if (ct && ct.id !== id) cids.add(ct.id);
      }
      if (cids.size) {
        const ce = (await getJSON(`https://www.wikidata.org/w/api.php?action=wbgetentities&ids=${[...cids].join('|')}&props=labels&languages=en&format=json&origin=*`)).entities;
        Object.values(pl).forEach(p => { if (p.countryId && ce[p.countryId] && ce[p.countryId].labels.en) p.country = ce[p.countryId].labels.en.value; });
      }
    }
    return { qid, born: born && { ...born, place: bp ? pl[bp.id] : null }, died: died && { ...died, place: dp ? pl[dp.id] : null } };
  }
  function life(title) {
    if (!lifeCache.has(title)) lifeCache.set(title, lookup(title).catch(() => null));
    return lifeCache.get(title);
  }
  function fmtDate(d) { if (!d) return ''; const y = d.year < 0 ? `${-d.year} BC` : d.year; return [d.day, d.month ? M[d.month - 1] : null, y].filter(Boolean).join(' '); }
  function fmtPlace(p) { if (!p || !p.name) return ''; return p.country && p.country !== p.name ? `${p.name}, ${p.country}` : p.name; }
  function ageAt(b, d) {
    if (!b) return null;
    const now = new Date(), e = d || { year: now.getFullYear(), month: now.getMonth() + 1, day: now.getDate() };
    let a = e.year - b.year;
    if (b.month && e.month && (e.month < b.month || (e.month === b.month && b.day && e.day && e.day < b.day))) a--;
    return a;
  }

  // ── Lookups in Weft's own data ──
  const evById = id => D.events.find(e => e.id === id);
  const evKey = e => e.year * 10000 + e.month * 100 + e.day;
  function eventsWithPerson(t) { return D.events.filter(e => (e.people || []).includes(t)).sort((a, b) => evKey(a) - evKey(b)); }
  function eventsAtPlace(k) { return D.events.filter(e => e.place === k).sort((a, b) => evKey(a) - evKey(b)); }
  function placeKeyByName(name) {
    if (!name) return null;
    const n = name.toLowerCase();
    return Object.keys(D.places).find(k => { const pn = D.places[k].name.toLowerCase(); return pn === n || pn.split(/[ ,(]/)[0] === n; }) || null;
  }

  // ── Chips on an event card ──
  function renderChips(container, ev) {
    container.innerHTML = '';
    const ppl = ev.people || [], pk = ev.place, pl = pk && D.places[pk];
    if (!ppl.length && !pl) return;
    const lab = document.createElement('div'); lab.className = 'who-label'; lab.textContent = 'Who & where'; container.appendChild(lab);
    ppl.forEach(t => {
      const p = D.people[t]; if (!p) return;
      const b = document.createElement('button'); b.className = 'who-chip';
      b.innerHTML = `<span class="wi">&#128100;</span><span>${esc(p.name)}</span>`;
      b.addEventListener('click', () => openPerson(t));
      container.appendChild(b);
    });
    if (pl) {
      const b = document.createElement('button'); b.className = 'who-chip place';
      b.innerHTML = `<span class="wi">&#128205;</span><span>${esc(pl.name)}</span>`;
      b.addEventListener('click', () => openPlace(pk));
      container.appendChild(b);
    }
  }

  function eventRow(e) {
    const d = D.domains[e.domain] || { color: '#888' };
    const b = document.createElement('button'); b.className = 'wp-ev';
    b.innerHTML = `<span class="d" style="background:${d.color}"></span><span>${esc(e.title)}</span><span class="y">${e.year}</span>`;
    b.addEventListener('click', () => onJump(e.id));
    return b;
  }

  // ── Person panel ──
  function openPerson(t) {
    const p = D.people[t]; if (!p) return;
    const evs = eventsWithPerson(t);
    body().innerHTML = `
      <div class="wp-kind">Person</div>
      <div class="wp-name">${esc(p.name)}</div>
      <div class="wp-desc">${esc(p.desc)}</div>
      <div class="wp-loading" id="wpLife">Looking up birth and death on Wikidata&hellip;</div>
      <div class="wp-sec">In Weft &middot; ${evs.length} event${evs.length === 1 ? '' : 's'}</div>
      <div class="wp-events" id="wpEvents"></div>
      <a class="wp-link" href="${esc(p.wiki)}" target="_blank" rel="noopener">&rarr; Wikipedia</a>`;
    const list = body().querySelector('#wpEvents');
    evs.forEach(e => list.appendChild(eventRow(e)));
    panel().classList.add('on'); panel().scrollTop = 0;
    onPerson(t, null, evs);
    life(t).then(L => {
      const slot = body().querySelector('#wpLife');
      if (!slot || body().querySelector('.wp-name').textContent !== p.name) return;
      if (!L || (!L.born && !L.died)) { slot.textContent = 'Birth and death details unavailable right now.'; onPerson(t, null, evs); return; }
      const row = (k, d, extra) => {
        const pkey = d.place && placeKeyByName(d.place.name);
        const placeHtml = d.place && d.place.name ? (pkey ? `<button data-pk="${pkey}">${esc(fmtPlace(d.place))}</button>` : esc(fmtPlace(d.place))) : '<span style="color:#5a6a80">place not recorded</span>';
        return `<div class="k">${k}</div><div class="v">${esc(fmtDate(d))}${extra ? ` <small>${extra}</small>` : ''}<small>${placeHtml}</small></div>`;
      };
      const a = ageAt(L.born, L.died);
      let html = '<div class="wp-life">';
      if (L.born) html += row('Born', L.born, '');
      if (L.died) html += row('Died', L.died, a != null ? `aged ${a}` : '');
      else if (L.born && a != null && a < 125) html += `<div class="k">Now</div><div class="v">${a} years old</div>`;
      html += '</div>';
      // life bar with Weft events as ticks
      if (L.born) {
        const y0 = L.born.year, y1 = L.died ? L.died.year : new Date().getFullYear();
        const span = Math.max(1, y1 - y0);
        const ticks = evs.filter(e => e.year >= y0 && e.year <= y1).map(e => `<span class="tick" title="${esc(e.title)}" style="left:${((e.year - y0) / span * 100).toFixed(1)}%"></span>`).join('');
        html += `<div class="wp-bar"><span class="span" style="left:0;right:0"></span>${ticks}</div><div class="wp-bar-l"><span>${y0 < 0 ? -y0 + ' BC' : y0}</span><span>${L.died ? y1 : 'today'}</span></div>`;
      }
      slot.outerHTML = html + '<div class="wp-note">Birth and death details from Wikidata.</div>';
      body().querySelectorAll('[data-pk]').forEach(b => b.addEventListener('click', () => openPlace(b.dataset.pk)));
      onPerson(t, L, evs);
    });
  }

  // ── Place panel ──
  function openPlace(k) {
    const pl = D.places[k]; if (!pl) return;
    const evs = eventsAtPlace(k);
    const coords = pl.lat != null ? `${Math.abs(pl.lat).toFixed(2)}&deg;${pl.lat >= 0 ? 'N' : 'S'}, ${Math.abs(pl.lon).toFixed(2)}&deg;${pl.lon >= 0 ? 'E' : 'W'}` : '';
    // People in Weft who were born or died here (from what we've already looked up)
    body().innerHTML = `
      <div class="wp-kind">Place</div>
      <div class="wp-name">${esc(pl.name)}</div>
      <div class="wp-desc">${esc(pl.country !== '—' ? pl.country : '')}${coords ? ` &middot; ${coords}` : ''}</div>
      <div class="wp-sec">Happened here &middot; ${evs.length} event${evs.length === 1 ? '' : 's'}</div>
      <div class="wp-events" id="wpEvents"></div>
      <div class="wp-sec" id="wpLivesH" style="display:none">Lives that began or ended here</div>
      <div class="wp-events" id="wpLives"></div>`;
    const list = body().querySelector('#wpEvents');
    evs.forEach(e => list.appendChild(eventRow(e)));
    panel().classList.add('on'); panel().scrollTop = 0;
    onClose();
    // Check the people already looked up this session for births/deaths here
    const lives = body().querySelector('#wpLives');
    lifeCache.forEach((prom, t) => prom.then(L => {
      if (!L || !body().querySelector('#wpLives')) return;
      [['born', L.born], ['died', L.died]].forEach(([kind, d]) => {
        if (d && d.place && placeKeyByName(d.place.name) === k) {
          body().querySelector('#wpLivesH').style.display = '';
          const b = document.createElement('button'); b.className = 'wp-ev';
          b.innerHTML = `<span class="d" style="background:#e8c878"></span><span>${esc(D.people[t].name)} ${kind} here</span><span class="y">${d.year}</span>`;
          b.addEventListener('click', () => openPerson(t));
          lives.appendChild(b);
        }
      });
    }));
  }

  return { init, renderChips, openPerson, openPlace, close, life, fmtDate, fmtPlace };
})();

let WEFT_PEOPLE = {};

// ── ERA ────────────────────────────────────────────────────────────────────────
function setEra(e, startYear) {
  era = e;

  // Frame the whole era: pull back far enough that its full width fits the screen
  // Fly in: frame roughly two and a half years (or the whole of a single year), starting at the era's beginning
  const [a0, a1] = ERAS[e];
  const spanMonths = Math.min((a1 - a0 + 1) * 12, 30);
  const halfW = (spanMonths * MONTH_W) / 2 + 60;
  const fit = halfW / (Math.tan(THREE.MathUtils.degToRad(camera.fov / 2)) * Math.max(camera.aspect, 0.6));
  const dist = fit + DEPTH / 2;
  const { xL } = eraBounds();
  const startX = startYear ? dateX(startYear, 1, 1, a0, a1) : xL;
  const tx = (a1 > a0) ? startX + halfW - 40 : 0;
  controls.target.set(tx, 0, -DEPTH / 2);
  camera.position.set(tx + dist * 0.28, dist * 0.32, -DEPTH / 2 + dist * 0.92);
  card.classList.remove('on');
}
function goDecade(y) {
  if (era !== 'modern') { setEra('modern', y); return; }
  const [a0, a1] = ERAS.modern;
  const halfW = (30 * MONTH_W) / 2 + 60;
  const tx = dateX(y, 1, 1, a0, a1) + halfW - 40;
  const dx = tx - controls.target.x;
  controls.target.x += dx; camera.position.x += dx;
}
document.querySelectorAll('.era-btn').forEach(b => b.addEventListener('click', () => {
  const k = b.dataset.era;
  if (DECADES[k]) goDecade(DECADES[k]); else setEra(k);
}));
function syncEraButtons() {
  let active = era;
  if (era === 'modern') {
    const { y0, xL } = eraBounds();
    const yr = y0 + Math.floor((controls.target.x - xL) / (12 * MONTH_W));
    active = yr < 1980 ? '1970s' : yr < 1990 ? '1980s' : '1990s';
  }
  document.querySelectorAll('.era-btn').forEach(b => b.classList.toggle('active', b.dataset.era === active));
}

// ── SLIDERS ────────────────────────────────────────────────────────────────────
const timeSlider = document.getElementById('timeSlider');
const zoomSlider = document.getElementById('zoomSlider');
const SHORT_M = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
let draggingTime = false, draggingZoom = false;

function eraBounds() {
  const [y0, y1] = ERAS[era];
  const total = (y1 - y0 + 1) * 12 * MONTH_W;
  return { y0, y1, xL: -total / 2, xR: total / 2 };
}
function xToLabel(x) {
  const { y0, y1, xL } = eraBounds();
  const months = Math.max(0, Math.min((y1 - y0 + 1) * 12 - 1, Math.floor((x - xL) / MONTH_W)));
  return `${SHORT_M[months % 12]} ${y0 + Math.floor(months / 12)}`;
}
// Zoom: logarithmic, top of the slider = closest
function zoomToDist(v) {
  const mn = controls.minDistance, mx = controls.maxDistance;
  return mn * Math.pow(mx / mn, 1 - v / 1000);
}
function distToZoom(d) {
  const mn = controls.minDistance, mx = controls.maxDistance;
  return (1 - Math.log(d / mn) / Math.log(mx / mn)) * 1000;
}

timeSlider.addEventListener('pointerdown', () => draggingTime = true);
timeSlider.addEventListener('pointerup', () => draggingTime = false);
timeSlider.addEventListener('input', () => {
  const { xL, xR } = eraBounds();
  const x = xL + (xR - xL) * (timeSlider.value / 1000);
  const dx = x - controls.target.x;
  controls.target.x += dx;
  camera.position.x += dx;
  document.getElementById('timeNow').textContent = xToLabel(x);
});
zoomSlider.addEventListener('pointerdown', () => draggingZoom = true);
zoomSlider.addEventListener('pointerup', () => draggingZoom = false);
zoomSlider.addEventListener('input', () => {
  const dir = camera.position.clone().sub(controls.target).normalize();
  camera.position.copy(controls.target).add(dir.multiplyScalar(zoomToDist(+zoomSlider.value)));
});

addEventListener('pointerup', () => { draggingTime = false; draggingZoom = false; });
addEventListener('pointercancel', () => { draggingTime = false; draggingZoom = false; });

function syncSliders() {
  const { y0, y1, xL, xR } = eraBounds();
  document.getElementById('timeStart').textContent = y0;
  document.getElementById('timeEnd').textContent = y1;
  if (!draggingTime) {
    const t = (controls.target.x - xL) / (xR - xL);
    timeSlider.value = Math.max(0, Math.min(1000, t * 1000));
    document.getElementById('timeNow').textContent = xToLabel(Math.max(xL, Math.min(xR, controls.target.x)));
  }
  if (!draggingZoom) zoomSlider.value = distToZoom(camera.position.distanceTo(controls.target));
  syncEraButtons();
}

// ── RESIZE / LOOP ──────────────────────────────────────────────────────────────
function resize() {
  renderer.setSize(innerWidth, innerHeight);
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
}
addEventListener('resize', resize);
resize();

function loop(t = 0) {
  const s = t * 0.0012;
  for (const h of halos) h.material.opacity = 0.22 + 0.16 * Math.sin(s + h.userData.phase);
  controls.update();
  syncSliders();
  updateHover();
  renderer.render(scene, camera);
  requestAnimationFrame(loop);
}

// ── DATA ───────────────────────────────────────────────────────────────────────
(async () => {
  try {
    const res = await fetch('weft-data.json', { cache: 'no-cache' });
    const data = await res.json();
    DOMAINS = data.domains;
    ALL_EVENTS = data.events;
    ALL_EVENTS.forEach(e => {
      (e.threads || []).forEach(t => {
        if (!THREAD_MAP.has(e.id)) THREAD_MAP.set(e.id, new Set());
        THREAD_MAP.get(e.id).add(t);
        if (!THREAD_MAP.has(t)) THREAD_MAP.set(t, new Set());
        THREAD_MAP.get(t).add(e.id);
      });
    });
    WEFT_PEOPLE = data.people || {};
    WeftWho.init(data, {
      onJump: id => { if (innerWidth < 700) WeftWho.close(); jumpTo(ALL_EVENTS.find(e => e.id === id)); },
      onPerson: (t, L, evs) => { lifeState = { title: t, L, evs }; drawLife(); },
      onClose: () => { lifeState = null; drawLife(); },
    });
    setEra('modern', 1980);
    loop();
    document.getElementById('loading').classList.add('off');
  } catch (err) {
    document.getElementById('loading').textContent = 'Could not load weft-data.json';
  }
})();
</script>
